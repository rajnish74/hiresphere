name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: hiresphere
          POSTGRES_USER: hire_user
          POSTGRES_PASSWORD: hire_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hire_user -d hiresphere"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MAIL_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw -B verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the Docker image
        run: docker build -t hiresphere:ci .