
services:
  postgres:
    image: postgres:17
    container_name: hiresphere-db
    environment:
      POSTGRES_DB: hiresphere
      POSTGRES_USER: hire_user
      POSTGRES_PASSWORD: hire_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mailpit:
    image: axllent/mailpit
    container_name: hiresphere-mailpit
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  pgdata:
