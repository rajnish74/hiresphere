services:
  postgres:
    image: postgres:17
    container_name: hiresphere-db
    environment:
      POSTGRES_DB: hiresphere
      POSTGRES_USER: hire_user
      POSTGRES_PASSWORD: hire_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hire_user -d hiresphere"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit
    container_name: hiresphere-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

  app:
    profiles: ["app"]
    build: .
    container_name: hiresphere-app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DB_URL: jdbc:postgresql://postgres:5432/hiresphere
      DB_USER: hire_user
      DB_PASSWORD: hire_pass
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the .env file}
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      STORAGE_DIR: /app/uploads/resumes
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "8082:8080"
    volumes:
      - uploads:/app/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads: