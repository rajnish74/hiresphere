server:
  forward-headers-strategy: native

spring:
  jpa:
    properties:
      hibernate:
        format_sql: false

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO
    com.hiresphere: INFO

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}