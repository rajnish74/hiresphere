<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #222; max-width: 560px; margin: auto;">
<h2 style="color: #1a56db;">Application update</h2>
<p>Hi <span th:text="${name}">Candidate</span>,</p>
<p>Your application for <strong th:text="${jobTitle}">Job</strong>
  at <strong th:text="${companyName}">Company</strong> is now
  <strong th:text="${status}">STATUS</strong>.</p>
<p th:text="${message}">Message</p>
<div th:if="${note != null}" style="border-left: 4px solid #1a56db; padding: 8px 14px; background: #f3f6fd;">
  <em>Message from the recruiter:</em><br/>
  <span th:text="${note}">Note</span>
</div>
<p><a th:href="${link}" style="background: #1a56db; color: #fff; padding: 10px 18px; text-decoration: none; border-radius: 6px;">View application</a></p>
<p style="color: #888; font-size: 12px;">HireSphere</p>
</body>
</html>
