<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #222; max-width: 560px; margin: auto;">
<h2 style="color: #1a56db;">Company verification update</h2>
<p>Your company <strong th:text="${companyName}">Company</strong> is now
  <strong th:text="${status}">STATUS</strong>.</p>
<p th:text="${message}">Message</p>
<div th:if="${reason != null}" style="border-left: 4px solid #b45309; padding: 8px 14px; background: #fdf6ec;">
  <em>Reason from the admin:</em><br/>
  <span th:text="${reason}">Reason</span>
</div>
<p><a th:href="${link}" style="background: #1a56db; color: #fff; padding: 10px 18px; text-decoration: none; border-radius: 6px;">Open company profile</a></p>
<p style="color: #888; font-size: 12px;">HireSphere</p>
</body>
</html>
