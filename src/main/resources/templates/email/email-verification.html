<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #222; max-width: 560px; margin: auto;">
<h2 style="color: #1a56db;">Verify your email</h2>
<p>Hi <span th:text="${name}">there</span>,</p>
<p>Welcome to HireSphere. Please confirm your email address to start applying for jobs.</p>
<p><a th:href="${link}" style="background: #1a56db; color: #fff; padding: 10px 18px; text-decoration: none; border-radius: 6px;">Verify email</a></p>
<p style="color: #666; font-size: 13px;">This link is valid for <span th:text="${validFor}">24 hours</span>.
    If you did not create an account, you can ignore this email.</p>
<p style="color: #888; font-size: 12px;">HireSphere</p>
</body>
</html>
