<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #222; max-width: 560px; margin: auto;">
<h2 style="color: #b45309;">Your job has been hidden</h2>
<p>Hello,</p>
<p>Your job <strong th:text="${jobTitle}">Job</strong> was hidden from public listings by an administrator.
    Candidates can no longer see it or apply to it.</p>
<div th:if="${reason != null}" style="border-left: 4px solid #b45309; padding: 8px 14px; background: #fdf6ec;">
    <em>Reason from the admin:</em><br/>
    <span th:text="${reason}">Reason</span>
</div>
<p>Please review and update the job. You can contact support to have it restored.</p>
<p><a th:href="${link}" style="background: #1a56db; color: #fff; padding: 10px 18px; text-decoration: none; border-radius: 6px;">Open job</a></p>
<p style="color: #888; font-size: 12px;">HireSphere</p>
</body>
</html>
