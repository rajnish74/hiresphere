<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial, sans-serif; color: #222; max-width: 560px; margin: auto;">
<h2 style="color: #1a56db;">Application received</h2>
<p>Hi <span th:text="${name}">Candidate</span>,</p>
<p>Your application for <strong th:text="${jobTitle}">Job</strong>
    at <strong th:text="${companyName}">Company</strong> has been submitted successfully.</p>
<p>You can follow its progress anytime:</p>
<p><a th:href="${link}" style="background: #1a56db; color: #fff; padding: 10px 18px; text-decoration: none; border-radius: 6px;">Track application</a></p>
<p style="color: #888; font-size: 12px;">HireSphere</p>
</body>
</html>
