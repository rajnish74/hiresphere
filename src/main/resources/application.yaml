
spring:
  application:
    name: hiresphere

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hiresphere}
    username: ${DB_USER:hire_user}
    password: ${DB_PASSWORD:hire_pass}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  flyway:
    enabled: true

  threads:
    virtual:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-min-32-bytes}
    access-token-minutes: 15
    refresh-token-days: 7
    issuer: hiresphere

  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  security:
    login:
      max-attempts: 5
      block-minutes: 15

  storage:
    base-dir: ${STORAGE_DIR:./uploads/resumes}

management:
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8082

logging:
  level:
    org.hibernate.SQL: DEBUG
